
[platformio]
default_envs = nodemcuv2

; ==========================================
; USB UPLOAD ENVIRONMENT
; ==========================================

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino

; LittleFS for website building background
board_build.filesystem = littlefs

monitor_speed = 115200
upload_speed = 460800

lib_deps =
    adafruit/Adafruit Fingerprint Sensor Library@^2.1.3


; ==========================================
; FOTA / OTA UPLOAD ENVIRONMENT
; ==========================================

[env:nodemcuv2_ota]
extends = env:nodemcuv2

upload_protocol = espota

; Replace with ESP8266 IP from Serial Monitor
upload_port = 192.168.1.100

upload_flags =
    --port=8266
    --auth=PASSWORD
